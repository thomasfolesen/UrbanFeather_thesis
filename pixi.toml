[workspace]
channels = [
    "conda-forge",
]
platforms = ["linux-64", "win-64"]

[dependencies]
python = "3.10.*"
numpy = ">=2.2.6,<3"
pandas = ">=2.3.3,<3"
scipy = ">=1.15.2,<2"
networkx = ">=3.4.2,<4"
tqdm = ">=4.70.0,<5"
texttable = ">=1.7.0,<2"
matplotlib = ">=3.10.9,<4"
scikit-learn = ">=1.7.2,<2"
osmnx = ">=2.0.7,<3"
geopandas = ">=1.1.4,<2"
shapely = ">=2.1.2,<3"
pyproj = ">=3.7.1,<4"
pyogrio = ">=0.11.0,<0.12"
pandana = ">=0.8,<0.9"
marimo = ">=0.24.0,<0.25"


[tasks]
smoke-feather = "python tests/smoke_feather.py"

smoke-imports = """
python -c "
import sys;
sys.path.insert(0, 'src/Utils');
sys.path.insert(0, 'src/Utils/FEATHER/src');

import OSM2FeatherConverter;
import osmnx;
import geopandas;
import shapely;
import pyproj;
import pyogrio;
import pandana;

print('UrbanFeather imports: OK');
"
"""

smoke-osm = """
PYTHONPATH="src/Utils:src/Utils/FEATHER/src" \
python src/Utils/OSM2FeatherConverter.py \
  --title pixi_smoke_osm \
  --output ./output \
  --type BBOX \
  --bbox 12.5650 55.6750 12.5700 55.6800 \
  --eval-points 2 \
  --order 1 \
  --theta-max 1.0 \
  --plotorders 0
"""

marimo-edit = "marimo edit notebooks/marimo/feather_smoke.py"
marimo-run = "marimo run notebooks/marimo/feather_smoke.py"